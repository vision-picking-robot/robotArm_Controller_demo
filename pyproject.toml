[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e0509-vision-picking-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["vision_picking*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
